<!DOCTYPE html>
<html lang="es">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>Merch Kirby</title>
 
    <style>
 
    /* =================================
       CONFIGURACIÓN GENERAL
    ================================= */
 
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
 
    body {
        background-image: url(https://i.pinimg.com/736x/39/7e/9f/397e9f64b443b9d7483504cf336aea62.jpg);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: repeat;
        overflow-x: hidden;
        min-height: 100vh;
    }
 
    /* =================================
       DECORACIONES
    ================================= */
 
    .boton {
        position: absolute;
        z-index: 99;
        width: 26%;
        max-width: 350px;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
    }
 
    .izq {
        position: absolute;
        z-index: 99;
        width: 16%;
        max-width: 220px;
        top: 200px;
        left: 17%;
    }
 
    .der {
        position: absolute;
        z-index: 99;
        width: 16%;
        max-width: 220px;
        top: 200px;
        right: 13%;
    }
 
    .escalar {
        position: absolute;
        z-index: 98;
        width: 200px;
        top: 350px;
        left: 100px;
        animation: MoverAnim2 2s infinite ease-in-out;
    }
 
    @keyframes MoverAnim2 {
        0%, 100% {
            transform: translateY(10px);
        }
 
        50% {
            transform: translateY(60px);
        }
    }
 
    .fresa {
        position: absolute;
        z-index: 98;
        width: 150px;
        top: 0;
        right: 15%;
        animation: MoverAnim1 2s infinite ease-in-out;
    }
 
    @keyframes MoverAnim1 {
        0%, 100% {
            transform: translateX(10px);
        }
 
        50% {
            transform: translateX(25px);
        }
    }
 
    .kirbys {
        position: absolute;
        z-index: 98;
        width: 350px;
        top: 900px;
        right: 3%;
        animation: escalarAnim 3s infinite alternate ease-in-out;
    }
 
    @keyframes escalarAnim {
        0% {
            transform: scale(.8);
        }
 
        100% {
            transform: scale(1);
        }
    }
 
    /* =================================
       CARRUSEL DE AMIIBOS
    ================================= */
 
    #slideshow {
        position: relative;
        width: 900px;
        max-width: 90%;
        height: 950px;
        margin: 50px auto 400px auto;
        background: linear-gradient(
            90deg,
            #fd4bb9 0%,
            #fa88f0 50%,
            #f8ed4b 100%
        );
        border-radius: 40px;
        overflow: hidden;
        display: flex;
        align-items: center;
    }
 
    .slide-wrapper {
        display: flex;
        width: max-content;
        animation: slide 24s infinite ease-in-out;
    }
 
    .slide {
        flex: 0 0 400px;
        width: 400px;
        height: 600px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
 
    .slide img {
        width: 350px;
        height: 450px;
        object-fit: contain;
        border-radius: 20px;
    }
 
    @keyframes slide {
        0%, 10% {
            transform: translateX(0);
        }
 
        12.5%, 22.5% {
            transform: translateX(-400px);
        }
 
        25%, 35% {
            transform: translateX(-800px);
        }
 
        37.5%, 47.5% {
            transform: translateX(-1200px);
        }
 
        50%, 60% {
            transform: translateX(-1600px);
        }
 
        62.5%, 72.5% {
            transform: translateX(-2000px);
        }
 
        75%, 85% {
            transform: translateX(-2400px);
        }
 
        87.5%, 97.5% {
            transform: translateX(-2800px);
        }
 
        100% {
            transform: translateX(0);
        }
    }
 
    /* =================================
       PIE DE PÁGINA
    ================================= */
 
    .img-footer {
        width: 100%;
        height: auto;
        display: block;
    }
 
    /* =================================
       TABLETS
    ================================= */
 
    @media screen and (max-width: 900px) {
 
        .boton {
            width: 30%;
        }
 
        .izq {
            width: 15%;
            left: 5%;
            top: 170px;
        }
 
        .der {
            width: 15%;
            right: 5%;
            top: 170px;
        }
 
        .escalar {
            width: 150px;
            left: 30px;
            top: 300px;
        }
 
        .fresa {
            width: 110px;
            right: 8%;
        }
 
        .kirbys {
            width: 250px;
            top: 850px;
        }
 
        #slideshow {
            width: 90%;
            height: 750px;
            margin-bottom: 300px;
        }
 
        .slide img {
            width: 320px;
            height: 400px;
        }
    }
 
    /* =================================
       CELULARES
    ================================= */
 
    @media screen and (max-width: 600px) {
 
        body {
            background-attachment: scroll;
            background-size: cover;
            background-position: center top;
        }
 
        .boton {
            width: 48%;
            max-width: 220px;
            top: 10px;
        }
 
        .izq {
            width: 22%;
            left: 2%;
            top: 140px;
        }
 
        .der {
            width: 22%;
            right: 2%;
            top: 140px;
        }
 
        .fresa {
            width: 75px;
            right: 5%;
            top: 5px;
        }
 
        .escalar {
            width: 100px;
            left: 5px;
            top: 260px;
        }
 
        .kirbys {
            width: 150px;
            right: 0;
            top: 720px;
        }
 
        /* CARRUSEL */
 
        #slideshow {
            width: 92%;
            height: 550px;
            margin: 180px auto 180px auto;
            border-radius: 25px;
        }
 
        .slide-wrapper {
            animation-duration: 24s;
        }
 
        .slide {
            flex: 0 0 100vw;
            width: 100vw;
            height: 450px;
        }
 
        .slide img {
            width: 80%;
            max-width: 300px;
            height: 350px;
            object-fit: contain;
        }
 
        @keyframes slide {
            0%, 10% {
                transform: translateX(0);
            }
 
            12.5%, 22.5% {
                transform: translateX(-100vw);
            }
 
            25%, 35% {
                transform: translateX(-200vw);
            }
 
            37.5%, 47.5% {
                transform: translateX(-300vw);
            }
 
            50%, 60% {
                transform: translateX(-400vw);
            }
 
            62.5%, 72.5% {
                transform: translateX(-500vw);
            }
 
            75%, 85% {
                transform: translateX(-600vw);
            }
 
            87.5%, 97.5% {
                transform: translateX(-700vw);
            }
 
            100% {
                transform: translateX(0);
            }
        }
 
        .img-footer {
            width: 100%;
            height: auto;
        }
 
    }
 
    /* =================================
       CELULARES MUY PEQUEÑOS
    ================================= */
 
    @media screen and (max-width: 380px) {
 
        .boton {
            width: 45%;
        }
 
        .izq, .der {
            width: 20%;
            top: 130px;
        }
 
        .escalar {
            width: 80px;
        }
 
        .kirbys {
            width: 120px;
        }
 
        #slideshow {
            height: 480px;
        }
 
        .slide img {
            height: 300px;
        }
 
    }
 
    /* RESPETAR MOVIMIENTO REDUCIDO */
 
    @media (prefers-reduced-motion: reduce) {
        .escalar,
        .fresa,
        .kirbys,
        .slide-wrapper {
            animation: none;
        }
    }
 
    </style>
</head>
 
<body>
 
    <!-- DECORACIONES -->
 
    <img class="boton" src="img/boto1.png" alt="Decoración">
 
    <img class="izq" src="img/izq.png" alt="Decoración izquierda">
 
    <img class="der" src="img/der.png" alt="Decoración derecha">
 
    <img class="fresa" src="img/fresa.png" alt="Fresa">
 
    <img class="escalar" src="img/kirby6.png" alt="Kirby">
 
    <img class="kirbys" src="img/kirby5.png" alt="Kirbys">
 
    <!-- CARRUSEL DE AMIIBOS -->
 
    <div id="slideshow">
 
        <div class="slide-wrapper">
 
            <div class="slide">
                <img src="img/amiibo1.png" alt="Amiibo 1">
            </div>
 
            <div class="slide">
                <img src="img/amiibo2.png" alt="Amiibo 2">
            </div>
 
            <div class="slide">
                <img src="img/amiibo3.png" alt="Amiibo 3">
            </div>
 
            <div class="slide">
                <img src="img/amiibo4.png" alt="Amiibo 4">
            </div>
 
            <div class="slide">
                <img src="img/amiibo5.png" alt="Amiibo 5">
            </div>
 
            <div class="slide">
                <img src="img/amiibo6.png" alt="Amiibo 6">
            </div>
 
            <div class="slide">
                <img src="img/amiibo7.png" alt="Amiibo 7">
            </div>
 
            <div class="slide">
                <img src="img/amiibo8.png" alt="Amiibo 8">
            </div>
 
        </div>
 
    </div>
 
    <!-- PIE DE PÁGINA -->
 
    <footer>
        <img
            src="img/pie de pagina2.png"
            alt="Pie de página"
            class="img-footer"
        >
    </footer>
 
</body>
</html>
